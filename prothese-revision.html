<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prothèse Révision — Réviser la prothèse dentaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --white:#ffffff;
  --bg:#F4F8FB;
  --bg-soft:#EEF5FA;
  --blue-pale:#E4F2FB;
  --blue-100:#D3E9FA;
  --blue-dark:#0E2F55;
  --blue-dark-2:#123B6B;
  --blue:#1861B0;
  --blue-strong:#0F4E96;
  --cyan:#18BEC9;
  --cyan-dark:#0DA3AD;
  --gray-50:#F7F9FB;
  --gray-100:#EEF1F4;
  --gray-300:#D7DEE5;
  --gray-500:#7C8B99;
  --gray-700:#3E4C5A;
  --text:#15222E;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow-sm:0 2px 10px rgba(16,45,80,.06);
  --shadow-md:0 10px 30px rgba(16,45,80,.10);
  --shadow-lg:0 20px 50px rgba(16,45,80,.14);
  --maxw:1180px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#F4F8FB; --bg-soft:#EEF5FA; }
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth; scroll-padding-top:calc(78px + env(safe-area-inset-top,0px));}
body{
  margin:0;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif; margin:0; color:var(--blue-dark); letter-spacing:-0.01em;}
p{margin:0;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
img{max-width:100%; display:block;}
ul{margin:0; padding:0; list-style:none;}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px;}
@media(max-width:640px){.wrap{padding:0 18px;}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:999px; font-weight:600; font-size:14.5px; border:none; transition:transform .15s ease, box-shadow .15s ease, background .15s ease; white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--blue-strong); color:#fff; box-shadow:0 8px 20px rgba(15,78,150,.25);}
.btn-primary:hover{background:var(--blue-dark-2); box-shadow:0 10px 24px rgba(15,78,150,.32);}
.btn-cyan{background:var(--cyan); color:#fff; box-shadow:0 8px 20px rgba(24,190,201,.28);}
.btn-cyan:hover{background:var(--cyan-dark);}
.btn-outline{background:#fff; color:var(--blue-strong); border:1.5px solid var(--blue-100);}
.btn-outline:hover{border-color:var(--blue-strong); background:var(--blue-pale);}
.btn-ghost{background:transparent; color:var(--blue-dark);}
.btn-ghost:hover{background:var(--blue-pale);}
.btn-sm{padding:8px 16px; font-size:13px;}
.btn-block{width:100%; justify-content:center;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}
.icon{width:1em;height:1em; flex-shrink:0;}

/* ---------- Header ---------- */
header.site{
  position:sticky; top:0; z-index:60; background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--gray-100);
}
.header-inner{display:flex; align-items:center; gap:22px; height:74px;}
.logo{display:flex; align-items:center; gap:10px; font-family:'Sora'; font-weight:700; font-size:17px; color:var(--blue-dark); flex-shrink:0;}
.logo .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--blue-strong),var(--cyan)); display:flex;align-items:center;justify-content:center; color:#fff; flex-shrink:0;}
.logo small{display:block; font-weight:500; font-size:10.5px; color:var(--cyan-dark); letter-spacing:.03em; margin-top:-2px;}
nav.main-nav{display:flex; gap:4px; flex:1;}
nav.main-nav a{padding:9px 13px; border-radius:999px; font-size:14.5px; font-weight:600; color:var(--gray-700); transition:background .15s,color .15s;}
nav.main-nav a:hover{background:var(--blue-pale); color:var(--blue-strong);}
nav.main-nav a.active{background:var(--blue-pale); color:var(--blue-strong);}
.header-actions{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--gray-100); background:#fff; display:flex; align-items:center; justify-content:center; color:var(--blue-dark); transition:background .15s,border-color .15s;}
.icon-btn:hover{background:var(--blue-pale); border-color:var(--blue-100);}
.burger{display:none;}
@media(max-width:980px){
  nav.main-nav{display:none;}
  .burger{display:flex;}
  .header-actions .btn{display:none;}
}
/* mobile drawer */
#mobileDrawer{position:fixed; inset:0; background:rgba(10,25,45,.45); z-index:90; display:none;}
#mobileDrawer.open{display:block;}
.drawer-panel{position:absolute; top:0; right:0; width:82%; max-width:340px; height:100%; background:#fff; padding:22px; padding-top:calc(22px + env(safe-area-inset-top,0px)); box-shadow:-10px 0 40px rgba(0,0,0,.15); display:flex; flex-direction:column; gap:6px; overflow-y:auto;}
.drawer-panel a{padding:13px 14px; border-radius:12px; font-weight:600; color:var(--blue-dark); font-size:15px;}
.drawer-panel a.active,.drawer-panel a:hover{background:var(--blue-pale);}
.drawer-close{align-self:flex-end; width:36px;height:36px;border-radius:50%;background:var(--gray-100); display:flex;align-items:center;justify-content:center; border:none; margin-bottom:6px;}

/* search overlay */
#searchOverlay{position:fixed; inset:0; background:rgba(10,25,45,.5); z-index:95; display:none; padding:8vh 18px;}
#searchOverlay.open{display:block;}
.search-box{max-width:640px; margin:0 auto; background:#fff; border-radius:18px; box-shadow:var(--shadow-lg); overflow:hidden;}
.search-input-row{display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--gray-100);}
.search-input-row input{flex:1; border:none; outline:none; font-size:17px; font-family:inherit; color:var(--text);}
.search-results{max-height:56vh; overflow-y:auto; padding:8px;}
.search-results .sr-item{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px;}
.search-results .sr-item:hover{background:var(--blue-pale);}
.sr-tag{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--blue-pale); color:var(--blue-strong); flex-shrink:0;}
.search-empty{padding:34px 20px; text-align:center; color:var(--gray-500); font-size:14px;}

/* ---------- Generic layout blocks ---------- */
main{min-height:60vh; padding-bottom:80px;}
.section{padding:64px 0;}
@media(max-width:640px){.section{padding:40px 0;}}
.eyebrow-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.section-title{font-size:clamp(22px,3vw,30px); font-weight:700;}
.section-sub{color:var(--gray-500); font-size:15px; margin-top:8px; max-width:560px;}
.section-head{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:32px; flex-wrap:wrap;}

.card{background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); border:1px solid var(--gray-100); transition:transform .18s ease, box-shadow .18s ease;}
.card.hoverable:hover{transform:translateY(-4px); box-shadow:var(--shadow-md);}

.pill{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; font-size:12px; font-weight:700; background:var(--blue-pale); color:var(--blue-strong);}
.pill.cyan{background:rgba(24,190,201,.12); color:var(--cyan-dark);}
.pill.gray{background:var(--gray-100); color:var(--gray-700);}

.grid{display:grid; gap:22px;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:980px){.grid.cols-3,.grid.cols-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

.reveal{animation:riseIn .5s ease both;}
@keyframes riseIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){ .reveal{animation:none;} }

/* thumbnails (css illustration placeholders, no external images) */
.thumb{position:relative; border-radius:var(--radius-md) var(--radius-md) 0 0; height:150px; display:flex; align-items:center; justify-content:center; overflow:hidden; color:#fff;}
.thumb svg{width:56px;height:56px; opacity:.92;}
.thumb::after{content:""; position:absolute; inset:0; background:radial-gradient(circle at 80% 0%, rgba(255,255,255,.22), transparent 60%);}
.thumb .thumb-dur{position:absolute; bottom:8px; right:10px; background:rgba(10,25,45,.55); color:#fff; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; z-index:2;}
.g1{background:linear-gradient(135deg,#1861B0,#18BEC9);}
.g2{background:linear-gradient(135deg,#123B6B,#3E8FD9);}
.g3{background:linear-gradient(135deg,#0DA3AD,#1861B0);}
.g4{background:linear-gradient(135deg,#7C57D9,#1861B0);}
.g5{background:linear-gradient(135deg,#E0895C,#B0439E);}

/* tooth dot pattern decoration */
.dot-pattern{position:absolute; inset:0; opacity:.5; background-image:radial-gradient(circle,rgba(255,255,255,.35) 1.4px, transparent 1.4px); background-size:16px 16px;}

/* favorite star button */
.fav-btn{width:34px;height:34px; border-radius:50%; background:#fff; border:1px solid var(--gray-100); display:flex; align-items:center; justify-content:center; color:var(--gray-300); box-shadow:var(--shadow-sm); transition:color .15s, transform .12s;}
.fav-btn.active{color:#F5A623;}
.fav-btn:active{transform:scale(.88);}

/* progress bar */
.pbar{height:9px; border-radius:999px; background:var(--gray-100); overflow:hidden;}
.pbar > span{display:block; height:100%; background:linear-gradient(90deg,var(--blue-strong),var(--cyan)); border-radius:999px; transition:width .6s ease;}

/* breadcrumb / back link */
.back-link{display:inline-flex; align-items:center; gap:6px; color:var(--blue-strong); font-weight:600; font-size:14px; margin-bottom:18px;}
.back-link:hover{text-decoration:underline;}

/* ---------- HOME ---------- */
.hero{position:relative; padding:56px 0 72px; overflow:hidden;}
.hero-grid{display:grid; grid-template-columns:1.05fr .95fr; gap:48px; align-items:center;}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;}}
.hero h1{font-size:clamp(32px,4.6vw,50px); line-height:1.08; font-weight:800;}
.hero h1 .accent{color:var(--cyan-dark);}
.hero p.lead{margin-top:18px; font-size:17px; color:var(--gray-700); max-width:480px; line-height:1.6;}
.hero-cta{display:flex; gap:14px; margin-top:28px; flex-wrap:wrap;}
.hero-stats{display:flex; gap:26px; margin-top:34px; flex-wrap:wrap;}
.hero-stat{display:flex; align-items:center; gap:10px;}
.hero-stat .ic{width:38px;height:38px;border-radius:11px; background:var(--blue-pale); color:var(--blue-strong); display:flex;align-items:center;justify-content:center;}
.hero-stat span{display:block; font-size:12.5px; color:var(--gray-500); font-weight:600;}
.hero-visual{position:relative; border-radius:28px; background:linear-gradient(155deg,var(--blue-dark),var(--blue-strong) 55%,var(--cyan-dark)); min-height:360px; display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:var(--shadow-lg);}
.hero-visual svg{width:78%; max-width:340px;}
.hero-visual .blob{position:absolute; width:220px;height:220px;border-radius:50%; background:rgba(255,255,255,.08);}
.hero-visual .blob.b1{top:-60px; left:-60px;}
.hero-visual .blob.b2{bottom:-80px; right:-40px; width:260px;height:260px; background:rgba(24,190,201,.18);}

.level-card{padding:26px; display:flex; flex-direction:column; gap:14px; position:relative;}
.level-card .lv-badge{width:44px;height:44px;border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700;}
.level-card h3{font-size:19px;}
.level-card p{color:var(--gray-500); font-size:14px; line-height:1.55;}
.level-card .lv-illus{position:absolute; right:18px; top:18px; width:52px;height:52px; opacity:.9;}

.feature-box{padding:24px 20px; text-align:left; display:flex; flex-direction:column; gap:12px;}
.feature-box .fic{width:46px;height:46px; border-radius:13px; background:var(--blue-pale); color:var(--blue-strong); display:flex; align-items:center; justify-content:center;}
.feature-box h4{font-size:15.5px;}
.feature-box p{font-size:13.5px; color:var(--gray-500); line-height:1.5;}

.course-card{overflow:hidden; display:flex; flex-direction:column;}
.course-card .cc-body{padding:18px 20px 20px; display:flex; flex-direction:column; gap:10px; flex:1;}
.course-card h4{font-size:16px;}
.course-card .cc-meta{display:flex; gap:8px; flex-wrap:wrap;}
.course-card p.desc{font-size:13.5px; color:var(--gray-500); line-height:1.5;}
.course-card .cc-foot{display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:6px;}

.cta-banner{background:linear-gradient(120deg,var(--blue-dark),var(--blue-strong) 60%, var(--cyan-dark)); border-radius:28px; padding:52px 48px; display:flex; align-items:center; justify-content:space-between; gap:30px; color:#fff; position:relative; overflow:hidden;}
.cta-banner h2{color:#fff; font-size:clamp(24px,3vw,32px);}
.cta-banner p{color:rgba(255,255,255,.82); margin-top:10px; max-width:420px;}
.cta-banner .cb-visual{width:150px;height:150px; flex-shrink:0;}
@media(max-width:760px){.cta-banner{flex-direction:column; text-align:center; padding:38px 24px;} .cta-banner .cb-visual{display:none;}}

/* dashboard preview on home */
.mini-dash{display:grid; grid-template-columns:1fr 1.3fr; gap:20px;}
@media(max-width:760px){.mini-dash{grid-template-columns:1fr;}}
.donut-wrap{display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; padding:28px;}
.activity-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--gray-100);}
.activity-row:last-child{border-bottom:none;}
.activity-ic{width:36px;height:36px;border-radius:10px; background:var(--blue-pale); color:var(--blue-strong); display:flex;align-items:center;justify-content:center; flex-shrink:0;}
.activity-row .at{font-size:13.5px; font-weight:600;}
.activity-row .as{font-size:12px; color:var(--gray-500);}

/* ---------- Filters ---------- */
.filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
.chip{padding:9px 16px; border-radius:999px; border:1.5px solid var(--gray-100); background:#fff; font-size:13.5px; font-weight:600; color:var(--gray-700); transition:.15s;}
.chip:hover{border-color:var(--blue-100);}
.chip.active{background:var(--blue-strong); border-color:var(--blue-strong); color:#fff;}
.filter-group-label{font-size:11.5px; font-weight:700; color:var(--gray-500); text-transform:uppercase; letter-spacing:.04em; margin:18px 0 8px;}
.filter-panel{background:#fff; border-radius:18px; padding:20px 22px; box-shadow:var(--shadow-sm); border:1px solid var(--gray-100); margin-bottom:28px;}
.search-mini{display:flex; align-items:center; gap:10px; background:var(--gray-50); border-radius:12px; padding:11px 16px; border:1px solid var(--gray-100);}
.search-mini input{border:none; background:transparent; outline:none; flex:1; font-family:inherit; font-size:14.5px;}

.empty-state{text-align:center; padding:60px 20px; color:var(--gray-500);}
.empty-state .es-ic{width:60px;height:60px; margin:0 auto 16px; color:var(--gray-300);}

/* ---------- Course reading page ---------- */
.lesson-head{background:linear-gradient(120deg,var(--blue-dark),var(--blue-strong)); border-radius:24px; padding:34px 36px; color:#fff; margin-bottom:30px;}
.lesson-head h1{color:#fff; font-size:clamp(22px,3vw,30px);}
.lesson-meta{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
.lesson-meta .lm{background:rgba(255,255,255,.14); padding:6px 13px; border-radius:999px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px;}
.lesson-body{background:#fff; border-radius:22px; padding:36px; box-shadow:var(--shadow-sm); border:1px solid var(--gray-100);}
.lesson-body h3{margin-top:28px; margin-bottom:12px; font-size:19px;}
.lesson-body h3:first-child{margin-top:0;}
.lesson-body p{color:var(--gray-700); line-height:1.75; font-size:15px; margin-bottom:14px;}
.callout{border-radius:16px; padding:18px 20px; margin:18px 0; display:flex; gap:14px; align-items:flex-start;}
.callout.retenir{background:rgba(24,190,201,.08); border:1px solid rgba(24,190,201,.25);}
.callout.vocab{background:var(--blue-pale); border:1px solid var(--blue-100);}
.callout .co-ic{width:32px;height:32px;border-radius:9px; background:#fff; display:flex;align-items:center;justify-content:center; flex-shrink:0; color:var(--cyan-dark); box-shadow:var(--shadow-sm);}
.callout strong{display:block; margin-bottom:4px; font-size:13.5px; color:var(--blue-dark);}
.callout p{margin:0; font-size:14px; color:var(--gray-700);}
.vocab-list{display:flex; flex-direction:column; gap:8px;}
.vocab-list li{font-size:14px;}
.vocab-list b{color:var(--blue-strong);}
.diagram-box{border:1.5px dashed var(--gray-300); border-radius:16px; padding:26px; text-align:center; color:var(--gray-500); font-size:13.5px; margin:18px 0; background:var(--gray-50);}
.diagram-box svg{width:100%; max-width:340px; margin:0 auto 10px;}
.lesson-table{width:100%; border-collapse:collapse; margin:16px 0; font-size:13.5px;}
.lesson-table th,.lesson-table td{border:1px solid var(--gray-100); padding:10px 12px; text-align:left;}
.lesson-table th{background:var(--gray-50); color:var(--blue-dark); font-weight:700;}
.lesson-foot{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:26px; padding-top:26px; border-top:1px solid var(--gray-100); flex-wrap:wrap;}
.done-check{display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; color:var(--gray-700);}

/* ---------- Video ---------- */
.video-player{border-radius:20px; background:linear-gradient(140deg,var(--blue-dark),var(--blue-strong)); aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; color:#fff; position:relative; box-shadow:var(--shadow-md); overflow:hidden;}
.video-player .play-btn{width:74px;height:74px;border-radius:50%; background:rgba(255,255,255,.18); border:2px solid rgba(255,255,255,.5); display:flex; align-items:center; justify-content:center; transition:transform .15s, background .15s;}
.video-player .play-btn:hover{background:rgba(255,255,255,.28); transform:scale(1.06);}

/* ---------- Documents ---------- */
.doc-card{display:flex; gap:16px; align-items:center; padding:18px 20px;}
.doc-ic{width:52px;height:52px;border-radius:13px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff;}
.doc-info{flex:1; min-width:0;}
.doc-info h4{font-size:15px; margin-bottom:4px;}
.doc-meta{display:flex; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--gray-500);}
.doc-actions{display:flex; gap:8px; flex-shrink:0;}
@media(max-width:560px){.doc-card{flex-wrap:wrap;} .doc-actions{width:100%; justify-content:flex-end;}}

/* ---------- Exercises ---------- */
.ex-type-card{padding:22px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;}
.ex-type-card .et-ic{width:48px;height:48px;border-radius:13px; background:var(--blue-pale); color:var(--blue-strong); display:flex; align-items:center; justify-content:center;}
.ex-runner{max-width:680px; margin:0 auto;}
.ex-progress-row{display:flex; align-items:center; gap:14px; margin-bottom:22px;}
.ex-progress-row .pbar{flex:1;}
.opt-list{display:flex; flex-direction:column; gap:10px; margin-top:20px;}
.opt-item{display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:14px; border:1.5px solid var(--gray-100); background:#fff; font-size:14.5px; font-weight:600; color:var(--gray-700); text-align:left; transition:.15s;}
.opt-item:hover{border-color:var(--blue-100); background:var(--blue-pale);}
.opt-item.selected{border-color:var(--blue-strong); background:var(--blue-pale); color:var(--blue-strong);}
.opt-item.correct{border-color:var(--cyan-dark); background:rgba(24,190,201,.12); color:var(--cyan-dark);}
.opt-item.wrong{border-color:#E15361; background:rgba(225,83,97,.09); color:#C43B48;}
.opt-radio{width:20px;height:20px;border-radius:50%; border:2px solid var(--gray-300); flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.opt-item.selected .opt-radio{border-color:var(--blue-strong);}
.blank-input{border:1.5px solid var(--gray-300); border-radius:8px; padding:5px 10px; font-family:inherit; font-size:14.5px; width:120px; text-align:center;}
.blank-input:focus{outline:none; border-color:var(--blue-strong);}
.feedback-box{margin-top:20px; padding:18px 20px; border-radius:16px; display:flex; gap:14px; align-items:flex-start;}
.feedback-box.ok{background:rgba(24,190,201,.1); border:1px solid rgba(24,190,201,.3);}
.feedback-box.ko{background:rgba(225,83,97,.08); border:1px solid rgba(225,83,97,.25);}
.feedback-box .fb-ic{width:32px;height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;}
.feedback-box.ok .fb-ic{background:var(--cyan-dark);}
.feedback-box.ko .fb-ic{background:#E15361;}
.assoc-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:20px;}
@media(max-width:560px){.assoc-grid{grid-template-columns:1fr;}}
.assoc-item{padding:14px 16px; border-radius:12px; border:1.5px solid var(--gray-100); background:#fff; font-size:14px; font-weight:600; cursor:pointer; transition:.15s;}
.assoc-item.sel{border-color:var(--blue-strong); background:var(--blue-pale);}
.assoc-item.matched{border-color:var(--cyan-dark); background:rgba(24,190,201,.12); cursor:default;}
.ex-nav{display:flex; justify-content:space-between; margin-top:26px;}
.result-summary{text-align:center; padding:40px 20px;}
.score-ring{width:150px;height:150px; margin:0 auto 20px;}

/* ---------- Quiz list ---------- */
.quiz-card{padding:22px 24px; display:flex; flex-direction:column; gap:14px;}
.quiz-card .qc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.quiz-card h4{font-size:16.5px;}
.quiz-card .qc-meta{display:flex; gap:16px; color:var(--gray-500); font-size:13px; flex-wrap:wrap;}
.quiz-card .qc-meta span{display:flex; align-items:center; gap:6px;}

/* ---------- Progression ---------- */
.stat-card{padding:22px; display:flex; align-items:center; gap:16px;}
.stat-card .sic{width:50px;height:50px;border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;}
.stat-card .sval{font-size:23px; font-weight:800; color:var(--blue-dark); font-family:'Sora';}
.stat-card .slabel{font-size:12.5px; color:var(--gray-500); font-weight:600;}
.class-progress-row{display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--gray-100);}
.class-progress-row:last-child{border-bottom:none;}
.class-progress-row .cpr-label{width:150px; flex-shrink:0; font-size:14px; font-weight:700; color:var(--blue-dark);}
.class-progress-row .cpr-pct{width:46px; text-align:right; font-size:13.5px; font-weight:700; color:var(--gray-700); flex-shrink:0;}
.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px;}
.badge-item{padding:18px 10px; text-align:center; border-radius:16px; background:var(--gray-50); border:1px solid var(--gray-100); display:flex; flex-direction:column; align-items:center; gap:8px;}
.badge-item.earned{background:linear-gradient(160deg,#FFF7E8,#FFEFD1); border-color:#F5D68A;}
.badge-item .bic{width:42px;height:42px; border-radius:50%; background:var(--gray-100); display:flex;align-items:center;justify-content:center; color:var(--gray-300); font-size:20px;}
.badge-item.earned .bic{background:#F5A623; color:#fff;}
.badge-item span{font-size:11.5px; font-weight:700; color:var(--gray-500); line-height:1.3;}
.badge-item.earned span{color:#946200;}
.level-track{display:flex; align-items:center; gap:0; margin-top:10px;}
.lt-step{flex:1; text-align:center; position:relative;}
.lt-step .ltdot{width:26px;height:26px;border-radius:50%; background:var(--gray-100); border:3px solid var(--gray-100); margin:0 auto 8px; display:flex; align-items:center; justify-content:center;}
.lt-step.done .ltdot{background:var(--cyan-dark); border-color:var(--cyan-dark);}
.lt-step.current .ltdot{background:var(--blue-strong); border-color:rgba(24,97,176,.25); box-shadow:0 0 0 5px rgba(24,97,176,.15);}
.lt-step span{font-size:11.5px; font-weight:700; color:var(--gray-500);}
.lt-step.done span,.lt-step.current span{color:var(--blue-dark);}
.lt-line{position:absolute; top:13px; left:-50%; width:100%; height:3px; background:var(--gray-100); z-index:-1;}
.lt-step.done .lt-line{background:var(--cyan-dark);}
.lt-step:first-child .lt-line{display:none;}
.recommend-item{display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:14px; background:#FFF8ED; border:1px solid #F5E1B8; margin-bottom:10px;}
.recommend-item .ric{color:#C98A1D; flex-shrink:0;}

/* ---------- Profile ---------- */
.profile-hero{display:flex; align-items:center; gap:20px; padding:28px; flex-wrap:wrap;}
.avatar{width:74px;height:74px;border-radius:50%; background:linear-gradient(135deg,var(--blue-strong),var(--cyan)); display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Sora'; font-weight:700; font-size:26px; flex-shrink:0;}
.form-row{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
.form-row label{font-size:12.5px; font-weight:700; color:var(--gray-500); text-transform:uppercase; letter-spacing:.03em;}
.form-row input,.form-row select,.form-row textarea{border:1.5px solid var(--gray-100); border-radius:11px; padding:11px 14px; font-family:inherit; font-size:14.5px; background:var(--gray-50); color:var(--text);}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none; border-color:var(--blue-strong); background:#fff;}

/* ---------- Auth modal ---------- */
.modal-bg{position:fixed; inset:0; background:rgba(10,25,45,.5); z-index:110; display:none; align-items:center; justify-content:center; padding:20px;}
.modal-bg.open{display:flex;}
.modal-box{background:#fff; border-radius:22px; max-width:400px; width:100%; padding:32px; box-shadow:var(--shadow-lg); position:relative; max-height:88vh; overflow-y:auto;}
.modal-close{position:absolute; top:18px; right:18px; width:32px;height:32px;border-radius:50%; background:var(--gray-100); border:none; display:flex; align-items:center; justify-content:center;}
.auth-tabs{display:flex; gap:4px; background:var(--gray-100); padding:4px; border-radius:12px; margin-bottom:22px;}
.auth-tabs button{flex:1; padding:9px; border:none; background:transparent; border-radius:9px; font-weight:700; font-size:13.5px; color:var(--gray-500);}
.auth-tabs button.active{background:#fff; color:var(--blue-strong); box-shadow:var(--shadow-sm);}

/* ---------- Admin ---------- */
.admin-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:26px;}
.admin-panel{display:none;}
.admin-panel.active{display:block;}
.admin-table{width:100%; border-collapse:collapse; background:#fff; border-radius:16px; overflow:hidden; box-shadow:var(--shadow-sm);}
.admin-table th,.admin-table td{padding:12px 16px; text-align:left; font-size:13.5px; border-bottom:1px solid var(--gray-100);}
.admin-table th{background:var(--gray-50); color:var(--blue-dark); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.03em;}
.admin-table tr:last-child td{border-bottom:none;}
.row-actions{display:flex; gap:6px;}
.icon-mini{width:30px;height:30px; border-radius:8px; border:1px solid var(--gray-100); background:#fff; display:flex; align-items:center; justify-content:center; color:var(--gray-500);}
.icon-mini:hover{background:var(--gray-50);}
.icon-mini.danger:hover{color:#E15361; border-color:#f3c3c7;}
.admin-form-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:640px){.admin-form-grid{grid-template-columns:1fr;}}
.toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--blue-dark); color:#fff; padding:13px 24px; border-radius:999px; font-size:14px; font-weight:600; box-shadow:var(--shadow-lg); z-index:200; opacity:0; transition:.25s; display:flex; align-items:center; gap:8px;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- Footer ---------- */
footer.site{background:var(--blue-dark); color:rgba(255,255,255,.75); padding:50px 0 calc(90px + env(safe-area-inset-bottom,0px));}
@media(min-width:981px){footer.site{padding-bottom:44px;}}
.footer-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:30px;}
@media(max-width:760px){.footer-grid{grid-template-columns:1fr 1fr;}}
footer.site h5{color:#fff; font-size:13px; margin-bottom:14px; font-weight:700;}
footer.site a{display:block; padding:5px 0; font-size:13.5px; color:rgba(255,255,255,.65);}
footer.site a:hover{color:#fff;}
.footer-bottom{margin-top:34px; padding-top:22px; border-top:1px solid rgba(255,255,255,.12); font-size:12.5px; color:rgba(255,255,255,.5); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}

/* ---------- Bottom mobile nav ---------- */
.mobile-nav{display:none;}
@media(max-width:980px){
  .mobile-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:70; background:#fff; border-top:1px solid var(--gray-100);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px)); justify-content:space-around; box-shadow:0 -6px 18px rgba(16,45,80,.06);
  }
  .mobile-nav a{display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--gray-500); font-size:10.5px; font-weight:700; padding:6px 8px; border-radius:12px; min-width:56px;}
  .mobile-nav a.active{color:var(--blue-strong); background:var(--blue-pale);}
  .mobile-nav a svg{width:21px;height:21px;}
  main{padding-bottom:120px;}
}

.view{display:none;}
.view.active{display:block;}
.skeleton{background:linear-gradient(90deg,var(--gray-100) 25%,#f5f7fa 37%,var(--gray-100) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:10px;}
@keyframes sk{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

.two-col{display:grid; grid-template-columns:2.1fr 1fr; gap:28px; align-items:start;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}
.side-card{padding:22px;}
.side-card h4{font-size:14px; margin-bottom:14px;}
.tag-row{display:flex; flex-wrap:wrap; gap:8px;}
</style>
</head>

/* ============================================================
   IDENTITÉ — compte Google réel (Firebase Authentication)
   ============================================================ */
let IDENTITY = { ready:false, signedIn:false, uid:null, name:'', email:'', photoURL:'', isAdmin:false };
let ADMIN = {courses:[],videos:[],documents:[],quizzes:[],exercises:[]};
function freshState(){
  return {
    profile:{prenom:'', nom:'', classe:CLASSES[0]},
    completedCourses:[], watchedVideos:[], exerciseResults:{}, quizResults:{},
    favorites:{courses:[],videos:[],documents:[],exercises:[],quizzes:[]},
    streak:0, lastVisit:null, needsOnboarding:true
  };
}
let STATE = freshState();

let _unsubUserDoc = null;
let _unsubContent = [];
let _saveTimer = null;

function signInGoogle(){
  if(!FIREBASE_OK){ toast('Connexion indisponible — Firebase ne s\'est pas chargé'); return; }
  const provider = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(err=>{
    console.error(err);
    toast('Connexion annulée ou impossible');
  });
}
function signOutUser(){
  if(!FIREBASE_OK) return;
  fbAuth.signOut().then(()=>{ nav('/'); toast('Déconnecté'); });
}

function initAuth(){
  if(!FIREBASE_OK){ IDENTITY.ready = true; render(); return; }
  fbAuth.onAuthStateChanged(async (user)=>{
    // clean up previous subscriptions
    if(_unsubUserDoc){ _unsubUserDoc(); _unsubUserDoc=null; }

    if(!user){
      IDENTITY = { ready:true, signedIn:false, uid:null, name:'', email:'', photoURL:'', isAdmin:false };
      STATE = freshState();
      render();
      return;
    }

    IDENTITY = {
      ready:true, signedIn:true, uid:user.uid,
      name:user.displayName||'', email:user.email||'', photoURL:user.photoURL||'',
      isAdmin:false
    };

    // vérifie si cet utilisateur est administrateur (document admins/{uid})
    try{
      const adminSnap = await fbDB.collection('admins').doc(user.uid).get();
      IDENTITY.isAdmin = adminSnap.exists;
    }catch(e){ console.warn('Vérification admin impossible', e); }

    subscribeUserDoc(user.uid);
    render();
  });
}

function subscribeUserDoc(uid){
  const ref = fbDB.collection('users').doc(uid);
  _unsubUserDoc = ref.onSnapshot(async (snap)=>{
    if(snap.exists){
      const d = snap.data();
      STATE = Object.assign(freshState(), d);
      STATE.needsOnboarding = !d.onboarded;
    } else {
      STATE = freshState();
      STATE.profile.prenom = (IDENTITY.name||'Élève').split(' ')[0];
      STATE.profile.nom = (IDENTITY.name||'').split(' ').slice(1).join(' ');
      try{ await ref.set(toStatePayload()); }catch(e){ console.warn('Création du profil impossible', e); }
    }
    render();
  }, err=>{ console.warn('Synchronisation du profil impossible', err); });
}

function toStatePayload(){
  return {
    profile: STATE.profile,
    completedCourses: STATE.completedCourses,
    watchedVideos: STATE.watchedVideos,
    exerciseResults: STATE.exerciseResults,
    quizResults: STATE.quizResults,
    favorites: STATE.favorites,
    streak: STATE.streak,
    lastVisit: STATE.lastVisit,
    onboarded: !STATE.needsOnboarding
  };
}

function saveState(){
  if(!FIREBASE_OK || !IDENTITY.signedIn){ toast('Connecte-toi avec Google pour sauvegarder ta progression'); return; }
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{
    fbDB.collection('users').doc(IDENTITY.uid).set(toStatePayload())
      .catch(e=>{ console.warn('Sauvegarde impossible', e); toast('Sauvegarde impossible pour le moment'); });
  }, 250);
}

/* ---- contenu pédagogique ajouté par l'administrateur (Firestore) ---- */
const CONTENT_COLLECTIONS = ['courses','videos','documents','quizzes','exercises'];
function subscribeContent(){
  CONTENT_COLLECTIONS.forEach(name=>{
    const un = fbDB.collection(name).onSnapshot(snap=>{
      ADMIN[name] = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      render();
    }, err=>console.warn(name+' — synchronisation impossible', err));
    _unsubContent.push(un);
  });
}
function allCourses(){ return [...COURSES, ...ADMIN.courses]; }
function allVideos(){ return [...VIDEOS, ...ADMIN.videos]; }
function allDocuments(){ return [...DOCUMENTS, ...ADMIN.documents]; }
function allQuizzes(){ return [...QUIZZES, ...ADMIN.quizzes]; }
function allExercises(){ return [...EXERCISES, ...ADMIN.exercises]; }

function toast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = I.check + ' <span>'+msg+'</span>';
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

function currentRoute(){
  let h = location.hash.replace(/^#/,'') || '/';
  const [path, query] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const q = {};
  if(query) query.split('&').forEach(kv=>{ const [k,v]=kv.split('='); q[k]=decodeURIComponent(v||''); });
  return {path, parts, q};
}

function openDrawer(){ document.getElementById('mobileDrawer').classList.add('open'); }
function closeDrawer(){ document.getElementById('mobileDrawer').classList.remove('open'); }
function openSearch(){ document.getElementById('searchOverlay').classList.add('open'); setTimeout(()=>document.getElementById('searchInput').focus(),50); document.getElementById('searchResults').innerHTML = '<div class="search-empty">Recherchez un cours, une vidéo, un document, un exercice ou un quiz.</div>'; }
function closeSearch(){ document.getElementById('searchOverlay').classList.remove('open'); }
function doSearch(val){
  const res = document.getElementById('searchResults');
  if(!val || val.trim().length<2){ res.innerHTML = '<div class="search-empty">Continuez à taper pour lancer la recherche…</div>'; return; }
  const q = val.toLowerCase();
  const hits = [];
  allCourses().forEach(c=>{ if((c.title+c.desc+c.matiere).toLowerCase().includes(q)) hits.push({type:'Cours',label:c.title,sub:c.classe+' · '+c.matiere,go:'/cours/'+c.id}); });
  allVideos().forEach(v=>{ if((v.title+v.desc+v.theme).toLowerCase().includes(q)) hits.push({type:'Vidéo',label:v.title,sub:v.classe+' · '+v.theme,go:'/videos/'+v.id}); });
  allDocuments().forEach(d=>{ if((d.title+d.desc+d.matiere).toLowerCase().includes(q)) hits.push({type:'Document',label:d.title,sub:d.classe+' · '+d.matiere,go:'/documents'}); });
  allExercises().forEach(e=>{ if((e.title+e.matiere).toLowerCase().includes(q)) hits.push({type:'Exercice',label:e.title,sub:e.classe+' · '+e.matiere,go:'/exercices/'+e.id}); });
  allQuizzes().forEach(qz=>{ if((qz.title+qz.matiere).toLowerCase().includes(q)) hits.push({type:'Quiz',label:qz.title,sub:qz.classe+' · '+qz.matiere,go:'/quiz/'+qz.id}); });
  if(hits.length===0){ res.innerHTML = '<div class="search-empty">Aucun résultat pour « '+val+' ».</div>'; return; }
  res.innerHTML = hits.slice(0,20).map(h=>`<a class="sr-item" href="#${h.go}" onclick="closeSearch();nav('${h.go}');return false;"><span class="sr-tag">${h.type}</span><span style="flex:1;"><b style="font-size:14px;">${h.label}</b><br><span style="font-size:12px;color:var(--gray-500);">${h.sub}</span></span>${I.arrowR}</a>`).join('');
}

function computeGlobalProgress(){
  const totalItems = allCourses().length + allQuizzes().length + allExercises().length;
  const done = STATE.completedCourses.length + Object.keys(STATE.quizResults).length + Object.keys(STATE.exerciseResults).length;
  if(totalItems===0) return 0;
  return Math.min(100, Math.round(done/totalItems*100)) || (done>0?8:0);
}
function donutSvg(pct){
  const r=54, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg viewBox="0 0 140 140" width="140" height="140">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--gray-100)" stroke-width="14"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="url(#gradDonut)" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 70 70)"/>
    <defs><linearGradient id="gradDonut" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0F4E96"/><stop offset="100%" stop-color="#18BEC9"/></linearGradient></defs>
    <text x="70" y="76" text-anchor="middle" font-family="Sora" font-size="26" font-weight="700" fill="var(--blue-dark)">${pct}%</text>
  </svg>`;
}
function recentActivityRows(n){
  const rows = [];
  Object.keys(STATE.quizResults).forEach(id=>{ const q=allQuizzes().find(x=>x.id===id); if(q) rows.push({ic:I.quiz,t:'Quiz '+q.matiere,s:'Score : '+STATE.quizResults[id]+'%'}); });
  STATE.completedCourses.forEach(id=>{ const c=allCourses().find(x=>x.id===id); if(c) rows.push({ic:I.book,t:c.title,s:'Cours terminé'}); });
  Object.keys(STATE.exerciseResults).forEach(id=>{ const e=allExercises().find(x=>x.id===id); if(e) rows.push({ic:I.pencil,t:e.title,s:'Exercice — '+STATE.exerciseResults[id]+'%'}); });
  if(rows.length===0) return `<div style="text-align:center; padding:28px 10px; color:var(--gray-500); font-size:13.5px;">Aucune activité pour le moment.<br>Commencez un cours ou un quiz !</div>`;
  return rows.slice(0,n).map(r=>`<div class="activity-row"><div class="activity-ic">${r.ic}</div><div><div class="at">${r.t}</div><div class="as">${r.s}</div></div></div>`).join('');
}

function lessonBlockHtml(b){

}

let EX_RUN = null;
function viewExerciseRunner(id){
  const ex = allExercises().find(x=>x.id===id);
  if(!ex) return emptyState('Exercice introuvable.');
  if(!EX_RUN || EX_RUN.id!==id) EX_RUN = {id, i:0, answers:[], checked:false, selected:null, blanks:[], selPair:null, matched:[]};
  const total = ex.questions ? ex.questions.length : 1;
  const qn = EX_RUN.i;
  return `<section class="section ex-runner">
    <a href="#/exercices" class="back-link" onclick="nav('/exercices');return false;">Retour aux exercices</a>
    <div class="ex-progress-row"><span style="font-size:13px;font-weight:700;color:var(--gray-500);">${qn+1} / ${total}</span><div class="pbar"><span style="width:${((qn+1)/total*100)}%"></span></div></div>
    <div class="card" style="padding:30px;">
      <div class="cc-meta" style="margin-bottom:14px;"><span class="pill">${ex.classe}</span><span class="pill gray">${ex.matiere}</span></div>
      ${renderExerciseQuestion(ex, qn)}
    </div>
  </section>`;
}
function renderExerciseQuestion(ex, qn){
  if(ex.type==='qcm' || ex.type==='vf'){
    const q = ex.questions[qn];
    const sel = EX_RUN.selected;
    const checked = EX_RUN.checked;
    return `<h3 style="font-size:18px; margin-bottom:6px;">${q.q}</h3>
    <div class="opt-list">
      ${q.options.map((o,i)=>{
        let cls='opt-item';
        if(checked){ if(i===q.correct) cls+=' correct'; else if(i===sel) cls+=' wrong'; }
        else if(sel===i) cls+=' selected';
        return `<button class="${cls}" ${checked?'disabled':''} onclick="selectOption(${i})"><span class="opt-radio">${checked&&i===q.correct?I.check:(checked&&i===sel?I.x:'')}</span>${o}</button>`;
      }).join('')}
    </div>
    ${checked?`<div class="feedback-box ${sel===q.correct?'ok':'ko'}"><div class="fb-ic">${sel===q.correct?I.check:I.x}</div><div><strong style="display:block;font-size:13.5px;margin-bottom:3px;">${sel===q.correct?'Bonne réponse !':'Pas tout à fait.'}</strong><p style="font-size:13.5px;color:var(--gray-700);">${q.explain}</p></div></div>`:''}
    ${exNav(ex, qn, checked, sel!==null)}
    `;
  }
  if(ex.type==='trou'){
    const q = ex.questions[qn];
    const checked = EX_RUN.checked;
    const parts = q.q.split('___');
    let out = parts[0];
    for(let i=1;i<parts.length;i++){
      const val = EX_RUN.blanks[i-1]||'';
      const correctVal = q.blanks[i-1];
      const ok = checked && val.trim().toLowerCase()===correctVal.toLowerCase();
      const bad = checked && !ok;
      out += `<input class="blank-input" style="${ok?'border-color:var(--cyan-dark);background:rgba(24,190,201,.1);':''}${bad?'border-color:#E15361;background:rgba(225,83,97,.08);':''}" ${checked?'disabled':''} value="${val}" oninput="EX_RUN.blanks[${i-1}]=this.value" placeholder="…">` + parts[i];
    }
    return `<h3 style="font-size:18px; margin-bottom:18px;">Complétez le texte</h3>
    <p style="font-size:16px; line-height:2.2; color:var(--gray-700);">${out}</p>
    ${checked?`<div class="feedback-box ok"><div class="fb-ic">${I.check}</div><div><strong style="display:block;font-size:13.5px;margin-bottom:3px;">Réponses attendues : ${q.blanks.join(', ')}</strong><p style="font-size:13.5px;color:var(--gray-700);">${q.explain}</p></div></div>`:''}
    ${exNav(ex, qn, checked, EX_RUN.blanks.filter(Boolean).length>0)}
    `;
  }
  if(ex.type==='assoc'){
    const pairs = ex.pairs;
    const checked = EX_RUN.checked;
    const left = pairs.map((p,i)=>({label:p[0], i}));
    const right = pairs.map((p,i)=>({label:p[1], i})).sort((a,b)=> (a.label+a.i).localeCompare(b.label+b.i));
    return `<h3 style="font-size:18px; margin-bottom:6px;">Associez chaque terme à sa définition</h3>
    <p style="font-size:13px;color:var(--gray-500); margin-bottom:6px;">Sélectionnez un terme puis sa définition correspondante.</p>
    <div class="assoc-grid">
      <div style="display:flex; flex-direction:column; gap:10px;">
        ${left.map(l=>`<div class="assoc-item ${EX_RUN.matched.includes(l.i)?'matched':(EX_RUN.selPair&&EX_RUN.selPair.side==='l'&&EX_RUN.selPair.i===l.i?'sel':'')}" onclick="pickAssoc('l',${l.i})">${l.label}</div>`).join('')}
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        ${right.map(r=>`<div class="assoc-item ${EX_RUN.matched.includes(r.i)?'matched':(EX_RUN.selPair&&EX_RUN.selPair.side==='r'&&EX_RUN.selPair.i===r.i?'sel':'')}" onclick="pickAssoc('r',${r.i})">${r.label}</div>`).join('')}
      </div>
    </div>
    ${EX_RUN.matched.length===pairs.length?`<div class="feedback-box ok" style="margin-top:20px;"><div class="fb-ic">${I.check}</div><div><strong style="display:block;font-size:13.5px;">Bravo, toutes les paires sont correctes !</strong></div></div>`:''}
    ${exNav(ex, qn, EX_RUN.matched.length===pairs.length, true, true)}
    `;
  }
  return '';
}
function exNav(ex, qn, checked, canValidate, isLast){
  const total = ex.questions ? ex.questions.length : 1;
  const lastQuestion = qn>=total-1 || isLast;
  return `<div class="ex-nav">
    <button class="btn btn-ghost" onclick="restartExercise()">Recommencer</button>
    ${!checked ? `<button class="btn btn-primary" ${canValidate?'':'disabled'} onclick="validateExercise('${ex.id}')">Valider</button>`
      : (lastQuestion ? `<button class="btn btn-primary" onclick="finishExercise('${ex.id}')">Voir le résultat ${I.arrowR}</button>` : `<button class="btn btn-primary" onclick="nextExerciseQuestion('${ex.id}')">Question suivante ${I.arrowR}</button>`)}
  </div>`;
}
function selectOption(i){ if(EX_RUN.checked) return; EX_RUN.selected=i; render(); }
function pickAssoc(side,i){
  if(EX_RUN.matched.includes(i) && false) return;
  if(!EX_RUN.selPair){ EX_RUN.selPair={side,i}; render(); return; }
  if(EX_RUN.selPair.side===side){ EX_RUN.selPair={side,i}; render(); return; }
  if(EX_RUN.selPair.i===i){ EX_RUN.matched.push(i); EX_RUN.selPair=null; render(); return; }
  EX_RUN.selPair=null; render();
}
function validateExercise(id){
  const ex = allExercises().find(x=>x.id===id);
  EX_RUN.checked = true;
  EX_RUN.answers[EX_RUN.i] = ex.type==='trou' ? true : EX_RUN.selected;
  render();
}
function nextExerciseQuestion(id){
  EX_RUN.i++; EX_RUN.checked=false; EX_RUN.selected=null; EX_RUN.blanks=[];
  render();
}
function restartExercise(){ const id=EX_RUN.id; EX_RUN={id,i:0,answers:[],checked:false,selected:null,blanks:[],selPair:null,matched:[]}; render(); }
function finishExercise(id){
  const ex = allExercises().find(x=>x.id===id);
  let score = 100;
  if(ex.type==='qcm'||ex.type==='vf'){
    let correct=0;
    ex.questions.forEach((q,i)=>{ if(EX_RUN.answers[i]===q.correct) correct++; });
    score = Math.round(correct/ex.questions.length*100);
  }
  STATE.exerciseResults[id] = score;
  saveState(); checkBadges();
  EX_RUN=null;
  document.getElementById('mainWrap').innerHTML = exerciseResultHtml(ex, score);
}
function exerciseResultHtml(ex, score){
  return `<section class="section ex-runner">
    <div class="card result-summary">
      <div class="score-ring">${donutSvg(score)}</div>
      <h2 style="margin-bottom:8px;">${score>=70?'Bien joué !':'Continuez à vous entraîner'}</h2>
      <p style="color:var(--gray-500); font-size:14.5px; margin-bottom:26px;">Vous avez obtenu ${score}% de bonnes réponses à « ${ex.title} ».</p>
      <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-outline" onclick="nav('/exercices/${ex.id}')">Recommencer</button>
        <button class="btn btn-primary" onclick="nav('/exercices')">Autres exercices ${I.arrowR}</button>
      </div>
    </div>
  </section>`;
}

  fbDB.collection(collection).add(data)

function val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
function deleteItem(store, id){
  if(!requireAdmin()) return;
  fbDB.collection(store).doc(id).delete()
    .then(()=>toast('Élément supprimé'))
    .catch(e=>{ console.error(e); toast('Suppression refusée — vérifie tes droits administrateur'); });
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(){
  const {path, parts, q} = currentRoute();
  let top = '/'+(parts[0]||'');
  if(top==='/') top='/';
  let body = '';
  if(parts.length===0){ body = viewHome(); top='/'; }
  else if(parts[0]==='cours' && parts.length===1){ body = viewCoursList(q); top='/cours'; }
  else if(parts[0]==='cours' && parts.length===2){ body = viewCourseDetail(parts[1]); top='/cours'; }
  else if(parts[0]==='videos' && parts.length===1){ body = viewVideoList(q); top='/videos'; }
  else if(parts[0]==='videos' && parts.length===2){ body = viewVideoDetail(parts[1]); top='/videos'; }
  else if(parts[0]==='documents'){ body = viewDocuments(q); top='/documents'; }
  else if(parts[0]==='exercices' && parts.length===1){ body = viewExercisesList(q); top='/exercices'; }
  else if(parts[0]==='exercices' && parts.length===2){ body = viewExerciseRunner(parts[1]); top='/exercices'; }
  else if(parts[0]==='quiz' && parts.length===1){ body = viewQuizList(q); top='/quiz'; }
  else if(parts[0]==='quiz' && parts.length===2){ body = viewQuizDetail(parts[1]); top='/quiz'; }
  else if(parts[0]==='quiz' && parts.length===3 && parts[2]==='run'){ body = viewQuizRun(parts[1]); top='/quiz'; }
  else if(parts[0]==='progression'){ body = viewProgression(); top='/progression'; }
  else if(parts[0]==='profil'){ body = viewProfil(); top='/profil'; }
  else if(parts[0]==='favoris'){ body = viewFavoris(); top='/favoris'; }
  else if(parts[0]==='admin'){ body = viewAdmin(); top='/admin'; }
  else { body = `<section class="section">${emptyState('Page introuvable.')}<div style="text-align:center;"><button class="btn btn-primary" onclick="nav(\'/\')">Retour à l\'accueil</button></div></section>`; }

  document.getElementById('app').innerHTML = chrome(top, body);
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}
</script>
